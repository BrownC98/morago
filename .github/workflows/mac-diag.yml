# TEMPORARY: diagnosis of the v0.4.1 dmg. Delete before merge.
name: mac-diag
on:
  push:
    branches: [맥실행오류]
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sw_vers
          gh release download v0.4.1 -p '*.dmg' -D "$RUNNER_TEMP"
          scripts/mac-launch-check.sh "$RUNNER_TEMP"/morago_0.4.1_aarch64.dmg
