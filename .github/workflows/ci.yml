name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a work branch cancels its older run. Runs on master and
# gate/* branches always finish (the merge gate waits for them).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/gate/') }}

env:
  # Only the integration branch and master save the Rust cache; work branches restore it.
  SAVE_CACHE: ${{ github.ref_name == '회의번역앱' || github.ref_name == 'master' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: check
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - run: pnpm install --frozen-lockfile
      - name: Frontend check
        run: pnpm build
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: OS credential store round-trip
        working-directory: src-tauri
        run: cargo test secrets -- --ignored

  # Installers (NSIS, dmg) only at release: tags v* and manual runs.
  bundle:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: bundle
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: morago-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
