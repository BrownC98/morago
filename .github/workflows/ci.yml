name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a work branch cancels its older run. Runs on master and
# gate/* branches always finish (the merge gate waits for them).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/gate/') }}

env:
  # CI builds are thrown away: no debug info, no incremental cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Which parts changed since master (on master: since the previous push).
  # Any doubt (no base, not a push, a tag) runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ]; then base="$BEFORE"; else base=$(git merge-base origin/master HEAD || true); fi
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" = tag ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          echo "rust=$(has '^(src-tauri/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "ui=$(has '^(src/|index\.html|package\.json|pnpm-lock\.yaml|tsconfig|vite\.config|\.github/)')" >> "$GITHUB_OUTPUT"

  # OS-independent checks, once on Linux.
  static:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust format
        if: needs.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo fmt --check
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.ui == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ui == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Frontend check (tsc, vite build)
        if: needs.changes.outputs.ui == 'true'
        run: pnpm install --frozen-lockfile && pnpm build

  # Per-OS compile, lint and tests: cfg(windows) and cfg(macos) code differs.
  # Debug builds do not embed the frontend, so no Node setup here.
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: check
          # Only the integration branch and master save; work branches restore.
          save-if: ${{ github.ref_name == '회의번역앱' || github.ref_name == 'master' }}
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: OS credential store round-trip
        working-directory: src-tauri
        run: cargo test secrets -- --ignored

  # Installers (NSIS, dmg) only at release: tags v* and manual runs.
  bundle:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: bundle
          save-if: false
      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: morago-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
