name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: "e2e: end-to-end test with real models. bundle: installers. mac-install: install and use the released dmg."
        type: choice
        required: true
        options: [e2e, bundle, mac-install]
      tag:
        description: "mac-install: the release tag"
        default: v0.7.0

# A new push to a work branch cancels its older run. Runs on master, the
# integration branch 회의번역앱 and gate/* always finish: the merge gate waits
# for the run of an exact commit (a push cancelled it twice on 2026-11-08).
# Manual runs have one group per `job` input, so a push or a manual run of
# the other job does not cancel them.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.job }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/회의번역앱' && !startsWith(github.ref, 'refs/heads/gate/') }}

env:
  # CI builds are thrown away: no debug info, no incremental cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # macOS: the Core Audio process tap API needs 14.2 (system audio itself is
  # gated at 14.6 at run time). Same value as bundle.macOS.minimumSystemVersion.
  MACOSX_DEPLOYMENT_TARGET: "14.2"

jobs:
  # Which parts changed since master (on master: since the previous push).
  # Any doubt (no base, not a push, a tag) runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ]; then base="$BEFORE"; else base=$(git merge-base origin/master HEAD || true); fi
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" = tag ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          echo "rust=$(has '^(src-tauri/|\.github/|rust-toolchain\.toml)')" >> "$GITHUB_OUTPUT"
          echo "ui=$(has '^(src/|index\.html|package\.json|pnpm-lock\.yaml|tsconfig|vite\.config|\.github/)')" >> "$GITHUB_OUTPUT"

  # OS-independent checks, once on Linux.
  static:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        if: needs.changes.outputs.rust == 'true'
      - name: Rust format
        if: needs.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo fmt --check
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.ui == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ui == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Frontend check (tsc, vite build)
        if: needs.changes.outputs.ui == 'true'
        run: pnpm install --frozen-lockfile && pnpm build

  # Per-OS compile, lint and tests: cfg(windows) and cfg(macos) code differs.
  # Debug builds do not embed the frontend, so no Node setup here.
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows 2022: nvcc 12.9 accepts Visual Studio 2017-2022 only, and
        # windows-latest has Visual Studio 2026 (run 42495337555).
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/sherpa-libs
      - uses: ./.github/actions/cuda-toolkit
        if: runner.os == 'Windows'
      # The runner has no GPU: PTX for one architecture is enough to compile
      # and link the CUDA code, in a fraction of the release build time.
      - name: Short CUDA build
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_CUDA_ARCHITECTURES=75-virtual" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: check
          # The unpacked sherpa-onnx libs live outside target/debug.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          # Only the integration branch and master save; work branches restore.
          save-if: ${{ github.ref_name == '회의번역앱' || github.ref_name == 'master' }}
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: OS credential store round-trip
        working-directory: src-tauri
        run: cargo test secrets -- --ignored

  # End to end with real models (VAD, SenseVoice Small, speaker embedding, Gemma 4
  # E2B): engine::tests::pipeline_end_to_end, translate::local::tests::local_model*;
  # Fun-ASR-MLT-Nano Q8_0 (transcribe.cpp): speech::funasr; Parakeet 일본어
  # (sherpa-onnx): speech::local. Manual runs only (about 5.5 GB of models,
  # cached; only master saves).
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'e2e' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LLAMA_LIB_PROFILE: Release
      MORAGO_TEST_MODELS: ${{ github.workspace }}/e2e/models
      MORAGO_TEST_WAVS: ${{ github.workspace }}/e2e/wavs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/sherpa-libs
      - uses: ./.github/actions/cuda-toolkit
        if: runner.os == 'Windows'
      - name: Short CUDA build (no GPU on the runner)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_CUDA_ARCHITECTURES=75-virtual" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: e2e
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          # A cache stays in the ref that saved it: branch copies only push
          # the master caches out of the 10 GB repository limit.
          save-if: ${{ github.ref_name == 'master' }}
      # The model files are the same on both OSes: one 5.1 GB copy, not two.
      - uses: actions/cache/restore@v4
        id: models
        with:
          path: e2e/models
          key: e2e-models-v5
          enableCrossOsArchive: true
      - name: Test speech clips (sherpa-onnx model test files)
        shell: bash
        run: |
          mkdir -p e2e/wavs && cd e2e/wavs
          hf=https://huggingface.co/csukuangfj
          curl -fsSL --retry 5 -o en0.wav $hf/sherpa-onnx-whisper-base/resolve/main/test_wavs/0.wav
          curl -fsSL --retry 5 -o sv_ko.wav $hf/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/test_wavs/ko.wav
          curl -fsSL --retry 5 -o sv_ja.wav $hf/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/test_wavs/ja.wav
      - name: End-to-end pipeline test
        working-directory: src-tauri
        run: cargo test --lib engine::tests::pipeline_end_to_end -- --ignored --nocapture
      - name: Fun-ASR (transcribe.cpp) on real clips
        working-directory: src-tauri
        run: cargo test --lib speech::funasr::tests::funasr_on_real_clips -- --ignored --nocapture
      - name: Parakeet Japanese on a real clip
        working-directory: src-tauri
        run: cargo test --lib speech::local::tests::parakeet_ja_on_a_real_clip -- --ignored --nocapture
      - name: Local translation with context
        working-directory: src-tauri
        env:
          MORAGO_TEST_MODELS_DIR: ${{ github.workspace }}/e2e/models
        run: cargo test --lib translate::local::tests::local_model -- --ignored --nocapture --test-threads=1
      - uses: actions/cache/save@v4
        if: github.ref_name == 'master' && steps.models.outputs.cache-hit != 'true'
        with:
          path: e2e/models
          key: e2e-models-v5
          enableCrossOsArchive: true

  # Installers (NSIS, dmg) only at release: tags v* and manual runs with job=bundle.
  bundle:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.job == 'bundle') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
            old: nsis
          - os: macos-latest
            # app: the updater archive (.app.tar.gz) comes from the app bundle.
            bundles: app,dmg
            old: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/sherpa-libs
      - uses: ./.github/actions/cuda-toolkit
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # llama-cpp-sys-2 does not rebuild when the CUDA architectures or the
          # toolkit change, so their files are in the restore prefix (rust-cache
          # ignores `key` when `shared-key` is set).
          shared-key: ${{ runner.os == 'Windows' && format('bundle-vs2022-{0}', hashFiles('src-tauri/.cargo/config.toml', '.github/actions/cuda-toolkit/action.yml')) || 'bundle' }}
          # The cached CUDA build of llama.cpp saves about an hour. Tag runs
          # cannot save for the next tag (a cache stays in the ref that saved
          # it), so manual runs save: on master for the tags.
          save-if: ${{ runner.os == 'Windows' && github.event_name == 'workflow_dispatch' }}
      - run: pnpm install --frozen-lockfile
      # The Tauri bundler downloads NSIS from GitHub releases without a token;
      # those requests got 504 on 2026-11-08 (run 42469147077). Put the same
      # files (versions of @tauri-apps/cli 2.12.4; the bundler checks their
      # SHA-1) into its tool folder with the job token first.
      - name: NSIS tools for the bundler
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="$LOCALAPPDATA/tauri"; mkdir -p "$t"; cd "$t"
          [ -f NSIS/NSIS.exe ] && exit 0
          gh release download nsis-3.13 -R tauri-apps/binary-releases -p nsis-3.13.zip --clobber
          unzip -q nsis-3.13.zip && mv nsis-3.13 NSIS && rm nsis-3.13.zip
          d=NSIS/Plugins/x86-unicode/additional; mkdir -p "$d"
          gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D "$d" --clobber
      # The updater key signs the update files (*.sig). AGENTS.md "Release".
      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Keep the release files
        shell: bash
        run: |
          # Not dist/: the UI build writes there.
          mkdir release-files; b=src-tauri/target/release/bundle
          cp $b/nsis/*-setup.exe* $b/dmg/*.dmg $b/macos/*.app.tar.gz* release-files/ 2>/dev/null || true
          ls -l release-files
      # The v0.4.1 dmg had only the linker's signature, and macOS called the
      # downloaded app "damaged" (run 42974938339).
      - name: Launch check of the dmg
        if: runner.os == 'macOS'
        run: scripts/mac-launch-check.sh release-files/*.dmg
      # An old build (0.0.1) installs the new files above through the updater.
      # Default shell: Git Bash puts its own link.exe before the MSVC linker.
      - name: Build an old version for the update test
        run: pnpm tauri build --bundles ${{ matrix.old }} --features update-test --config "$PWD/scripts/update-test.conf.json"
      - name: Update test
        shell: bash
        timeout-minutes: 15
        run: scripts/update-test.sh release-files
      - uses: actions/upload-artifact@v4
        with:
          name: morago-${{ matrix.os }}
          path: release-files/*
          if-no-files-found: error

  # A user's path on a Mac with the dmg of a GitHub release: install, open,
  # download models, run a meeting. Manual runs only.
  mac-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'mac-install' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/mac-install/check.sh "${{ inputs.tag }}" mac-install-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-install
          path: mac-install-out

  # Release files and the updater manifest. On a tag: the GitHub release.
  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: morago-*
          path: release-files
          merge-multiple: true
      - name: Updater manifest
        run: |
          v=v$(jq -r .version src-tauri/tauri.conf.json)
          tag=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Else installed apps install the same build again at each start.
          [ -z "$tag" ] || [ "$tag" = "$v" ] || { echo "::error::tag $tag is not the app version $v"; exit 1; }
          tag=$v
          scripts/release-manifest.sh release-files "$GITHUB_REPOSITORY" "$tag" > release-files/latest.json
          cat release-files/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: release-files/latest.json
      # The release notes stay with the person who releases: gh release edit.
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "morago ${TAG#v}" --notes ""
          gh release upload "$TAG" --clobber release-files/*-setup.exe release-files/*.dmg release-files/*.app.tar.gz release-files/latest.json
