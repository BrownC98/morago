[package]
name = "morago"
version = "0.4.1"
description = "Meeting minutes with live translated subtitles"
authors = ["morago"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "morago_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
thiserror = "2.0.21"
log = "0.4.35"
env_logger = "0.11.11"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "http2", "system-proxy"] }
crossbeam-channel = "0.5.17"
tauri-plugin-dialog = "2"
cpal = "0.18"
rubato = "5"
keyring-core = "1.0.1"
zeroize = "1.9.1"
tempfile = "3.27.0"
sherpa-onnx = "2.0.1"
sherpa-onnx-sys = "=2.0.1"
# No default features: no OpenMP runtime (vcomp) to ship on Windows.
llama-cpp-2 = { version = "0.1.161", default-features = false }
# Same version as llama-cpp-2 uses: gpu.rs reads llama.cpp log lines for error causes.
llama-cpp-sys-2 = "0.1.161"
# Local Whisper. whisper.cpp builds on the ggml of llama-cpp-2: vendor/whisper-rs-sys.
whisper-rs = { version = "=0.16.0", default-features = false }
# Local Fun-ASR (transcribe.cpp). It builds on the ggml of llama-cpp-2: vendor/transcribe-cpp-sys.
transcribe-cpp = { version = "=0.4.1", default-features = false }
sha2 = "0.11"
# Unpacks the NVIDIA CUDA archives of the "GPU 구성 요소" pack (gpu.rs).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The GPU pack folder before Tauri starts (gpu.rs); Tauri uses the same crate.
dirs = "7"
# Updates from GitHub releases (latest.json); AGENTS.md "Release".
tauri-plugin-updater = "2"

# OS credential stores for API keys (secrets.rs). Linux is for development only.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# CUDA on NVIDIA GPUs. The CUDA DLLs are not in the installer: build.rs
# delay-loads them and gpu.rs downloads them on demand.
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# Metal GPU offload on macOS.
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }
# System audio on macOS (src/audio/macos_tap.rs). Same versions and features as cpal's.
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "HostTime", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3.1"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[dev-dependencies]
hound = "3"

[features]
# CI update test only (scripts/update-test.sh): the app installs an update at start.
update-test = []

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
transcribe-cpp-sys = { path = "vendor/transcribe-cpp-sys" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
