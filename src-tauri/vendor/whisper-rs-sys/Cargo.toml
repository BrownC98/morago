[package]
name = "whisper-rs-sys"
version = "0.15.0"
edition = "2021"
rust-version = "1.88.0"
description = "Rust bindings for whisper.cpp (FFI bindings), built on the ggml of llama-cpp-sys-2"
license = "Unlicense"
repository = "https://codeberg.org/tazz4843/whisper-rs"
links = "whisper"
publish = false

# whisper-rs 0.16 forwards these features; the fork ignores the GPU ones
# (llama-cpp-2 features select the ggml backends).
[features]
coreml = []
cuda = []
hipblas = []
openblas = []
metal = []
vulkan = []
force-debug = []
openmp = []
intel-sycl = []

[dependencies]
# ggml comes from llama-cpp-sys-2 (DEP_LLAMA_GGML_CMAKE_DIR); whisper.cpp is built against it.
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false }

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"
fs_extra = "1.3"
