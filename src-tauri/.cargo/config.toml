# Windows: sherpa-onnx ships static-CRT (/MT) libraries. llama.cpp must use the
# same CRT, or the link fails (LNK2038, LNK2005). The cmake crate flag alone is
# not enough: CMake policy CMP0091 takes the runtime from CMAKE_MSVC_RUNTIME_LIBRARY.
# No effect on other targets.
[env]
LLAMA_STATIC_CRT = "1"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
