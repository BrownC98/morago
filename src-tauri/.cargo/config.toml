# macOS: link CoreAudio weakly. AudioHardwareCreateProcessTap and AudioHardwareDestroyProcessTap
# exist from macOS 14.2 and cpal references them (its loopback path); the app supports macOS 13
# (tauri.conf.json minimumSystemVersion), where a strong import stops the launch with "Symbol not
# found". src/audio/macos_tap.rs checks the OS version before it uses them.
# Checked by the test `no_strong_import_of_process_tap_symbols` (macos_tap.rs).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-weak_framework,CoreAudio"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-weak_framework,CoreAudio"]
